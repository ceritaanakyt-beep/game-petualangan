name: Deploy Game ke GitHub Pages

# Dijalankan otomatis setiap kali kode di-push ke branch main
on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin yang dibutuhkan agar GitHub boleh menerbitkan halaman
permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan proses lama bila ada perubahan baru
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang kebutuhan (dependencies)
        run: npm install

      - name: Bangun aplikasi (build)
        # --base memakai nama repositori agar file bisa dibuka di alamat GitHub Pages
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Siapkan halaman (configure pages)
        uses: actions/configure-pages@v5

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
